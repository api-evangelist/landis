aid: landis
name: Landis
description: 'Landis Technologies Inc. is a rent-to-own homeownership company that
  helps renters become homeowners. A client applies for free, Landis underwrites them
  and issues an approved home budget, the client shops for a home with a real estate
  agent, and Landis buys that home all cash and rents it back to them while a dedicated
  Homeownership Coach works a tailored mortgage-readiness plan covering credit score,
  debt-to-income ratio, and down-payment savings. When the client is mortgage-eligible
  they buy the home back. Landis operates in 8 states and runs two web portals — Path
  for clients and Ally for real estate agents — plus referral programs for agents,
  lenders, and homebuilders. It is SOC 2 Type 2 certified. Landis raised a $165M Series
  A and a $40M Series B backed by GV, Sequoia, and Jay-Z''s Roc Nation. Landis publishes
  no public developer API, SDK, or developer portal.'
